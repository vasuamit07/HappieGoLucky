<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HappieGoLucky - Doodle Flight Search</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <header class="doodle-header">
        <h1 class="doodle-text">HappieGoLucky ✈️</h1>
        <p>Your Doodle Flight Finder!</p>
    </header>

    <section class="search-section doodle-border">
        <form id="flightSearchForm" class="doodle-form">
            <div class="form-group">
                <label for="from" class="doodle-label">From:</label>
                <input type="text" id="from" placeholder="e.g., JFK" required>
            </div>
            <div class="form-group">
                <label for="to" class="doodle-label">To:</label>
                <input type="text" id="to" placeholder="e.g., LHR" required>
            </div>
            <div class="form-group">
                <label for="date" class="doodle-label">Date:</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit" class="doodle-button">Find Flights!</button>
        </form>
    </section>

    <section class="results-section">
        <h2 class="doodle-subheading">Results:</h2>
        <div id="flightResults" class="flight-list">
            <p class="initial-message doodle-text">Enter your journey details to start doodling flights!</p>
        </div>
    </section>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
