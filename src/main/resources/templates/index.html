<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>HappieGoLucky - Flight Finder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav class="doodle-nav">
    <span sec:authorize="isAuthenticated()" class="doodle-text" style="color: #6c5ce7; font-weight: bold;">
        Hi, <span th:text="${#authentication.name}">amit</span>! 👋
    </span>

        <a th:href="@{/}" class="doodle-link">Search</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/my-bookings}" class="doodle-link">My Bookings</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="doodle-link">Login</a>
        <a sec:authorize="isAnonymous()" th:href="@{/register}" class="doodle-link">Sign Up</a>

        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none; border:none; cursor:pointer; color:#6c5ce7; font-family:'Kalam'; font-weight:bold; text-decoration:underline;">Logout</button>
        </form>
    </nav>

    <header class="doodle-header">
        <h1>HappieGoLucky ✈️</h1>
    </header>

    <form id="flightSearchForm" class="search-section">
        <div class="form-group">
            <label class="doodle-label">From</label>
            <input type="text" id="from" placeholder="JFK" required>
        </div>
        <div class="form-group">
            <label class="doodle-label">To</label>
            <input type="text" id="to" placeholder="LHR" required>
        </div>
        <div class="form-group">
            <label class="doodle-label">Date</label>
            <input type="date" id="date" required>
        </div>
        <button type="submit" class="doodle-button">Find!</button>
    </form>

    <div id="flightResults" class="flight-list"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
