<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappieGoLucky | Real-Time Deals</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar"><div class="logo">☀️ HappieGoLucky</div></nav>

<div class="hero">
    <h1>Find Your Happie Place</h1>
    <p>Real-time prices sorted from cheapest to best.</p>
</div>

<div class="container">
    <div class="search-box-expanded">
        <div class="search-row">
            <div class="input-group">
                <label>From</label>
                <input type="text" id="from" list="fromList" placeholder="NYC" oninput="fetchSuggestions('from')">
                <datalist id="fromList"></datalist>
            </div>

            <div class="input-group">
                <label>To</label>
                <input type="text" id="to" list="toList" placeholder="LON" oninput="fetchSuggestions('to')">
                <datalist id="toList"></datalist>
            </div>
        </div>

        <div class="search-row">
            <div class="input-group">
                <label>Departure</label>
                <input type="date" id="depDate" value="2026-02-15">
            </div>
            <div class="input-group">
                <label>Return</label>
                <input type="date" id="retDate">
            </div>
            <div class="input-group">
                <label>Travelers</label>
                <div class="passenger-picker">
                    <div class="counter">
                        <span>Adults</span>
                        <button onclick="updateCount('adults', -1)">-</button>
                        <span id="adultsCount">1</span>
                        <button onclick="updateCount('adults', 1)">+</button>
                    </div>
                    <div class="counter">
                        <span>Children</span>
                        <button onclick="updateCount('children', -1)">-</button>
                        <span id="childrenCount">0</span>
                        <button onclick="updateCount('children', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-footer">
            <div style="display:flex; gap:10px;">
                <select id="currencySelector" onchange="convertPrices()">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="INR">INR (₹)</option>
                    <option value="GBP">GBP (£)</option>
                </select>

                <select id="sortSelector" onchange="sortResults()">
                    <option value="cheap">Sort: Cheapest 💰</option>
                    <option value="fast">Sort: Fastest ⚡</option>
                    <option value="best">Sort: Best Value ⭐</option>
                </select>
            </div>

            <button class="btn-main" onclick="performSearch()">Search Live Deals ✈️</button>
        </div>
    </div>

    <div id="loader" class="loader" style="display:none">Scanning Amadeus Global GDS... 📡</div>
    <div id="results"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
