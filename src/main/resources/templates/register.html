<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - HappieGoLucky</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container auth-container">
    <header class="doodle-header">
        <h1 class="doodle-text">Sign Up ✍️</h1>
    </header>

    <section>
        <div th:if="${errorMessage}" class="doodle-text" style="color: #d63031; margin-bottom: 10px;" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post" class="auth-form">
            <div class="form-group">
                <label class="doodle-label">Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label class="doodle-label">Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label class="doodle-label">Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label class="doodle-label">Confirm Password</label>
                <input type="password" name="confirmPassword" required>
            </div>

            <button type="submit" class="doodle-button">Register Now!</button>
        </form>
    </section>
</div>
</body>
</html>
