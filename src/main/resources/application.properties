# App Name
spring.application.name=HappieGoLucky

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:happiegoluckydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console to view the DB in browser (optional but helpful)
spring.h2.console.enabled=true

# Create tables automatically based on our Java classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (so we can see what's happening)
spring.jpa.show-sql=true

